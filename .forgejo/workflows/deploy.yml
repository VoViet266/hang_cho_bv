name: Deploy Hang Cho Kham

on:
  push:
    branches:
      - main
      - master

env:
  CONTAINER_NAME: hang_cho_kham
  IMAGE_NAME: 10.10.20.49:3000/vqviet/hang_cho_kham
  PORT: 3002

jobs:
  test:
    name: Run Tests
    runs-on: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm run test --if-present || echo "Bỏ qua test do chưa cấu hình"

  build:
    name: Build & Push to Internal Registry
    needs: test
    runs-on: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login internal registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login 10.10.20.49:3000 --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"
          IMAGE_SHA="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_LATEST" \
            --tag "$IMAGE_SHA" \
            --push \
            .

  deploy:
    name: Deploy via SSH Key
    needs: build
    runs-on: deploy
    steps:
      - name: Setup SSH agent and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.PORT }}
          LOGS_VOLUME: ${{ secrets.LOGS_VOLUME || '/home/vqviet/logs/application' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          SSH_CMD_ENV="REGISTRY_TOKEN=$(printf '%q' "$REGISTRY_TOKEN") REGISTRY_USERNAME=$(printf '%q' "$REGISTRY_USERNAME") DATABASE_URL=$(printf '%q' "$DATABASE_URL") IMAGE_NAME=$(printf '%q' "$IMAGE_NAME") CONTAINER_NAME=$(printf '%q' "$CONTAINER_NAME") PORT=$(printf '%q' "$PORT") LOGS_VOLUME=$(printf '%q' "$LOGS_VOLUME")"

          ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" $SSH_CMD_ENV /bin/bash -s <<'EOF'
            set -e

            echo "Đăng nhập Internal Registry..."
            if [ -z "$REGISTRY_TOKEN" ]; then
              echo "Lỗi: Không tìm thấy REGISTRY_TOKEN trong Secrets!"
              exit 1
            fi
            printf '%s' "$REGISTRY_TOKEN" | docker login 10.10.20.49:3000 -u "$REGISTRY_USERNAME" --password-stdin


            PREVIOUS_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")

            echo "Pulling image mới nhất..."
            docker pull "$IMAGE_NAME:latest"

            echo "Dừng container cũ..."
            docker rm -f "$CONTAINER_NAME" || true

            mkdir -p "$LOGS_VOLUME"
            chmod 755 "$LOGS_VOLUME"

            # Hàm khởi chạy container
            start_container() {
              local IMAGE=$1
              docker run -d \
                --name "$CONTAINER_NAME" \
                -p "$PORT:$PORT" \
                -e PORT="$PORT" \
                -e TZ="Asia/Ho_Chi_Minh" \
                -e DATABASE_URL="$DATABASE_URL" \
                -v /etc/localtime:/etc/localtime:ro \
                -v "$LOGS_VOLUME":/app/logs/Applications/Hangcho \
                --restart unless-stopped \
                "$IMAGE"
            }

            echo "Khởi động container với image mới..."
            start_container "$IMAGE_NAME:latest"

            echo "Chờ service khởi động..."
            retries=6
            count=0
            until curl -s -f -I http://localhost:"$PORT" > /dev/null 2>&1 || [ "$count" -ge "$retries" ]; do
              count=$((count + 1))
              echo "Healthcheck attempt $count/$retries failed; retry in 5s..."
              sleep 5
            done

            if curl -s -f -I http://localhost:"$PORT" > /dev/null 2>&1; then
              echo "Health check thành công (server đang lắng nghe)!"
            else
              echo "Health check thất bại! Dump logs của container bị lỗi:"
              docker logs "$CONTAINER_NAME" --tail=100

              echo "Bắt đầu rollback quá trình deploy..."
              docker rm -f "$CONTAINER_NAME" || true

              if [ -n "$PREVIOUS_IMAGE_ID" ]; then
                echo "Khôi phục lại container từ image cũ ($PREVIOUS_IMAGE_ID)..."
                start_container "$PREVIOUS_IMAGE_ID"

                echo "Chờ service cũ khởi động lại..."
                sleep 5
                if curl -s -f -I http://localhost:"$PORT" > /dev/null 2>&1; then
                   echo "Rollback thành công! Hệ thống đã quay về bản cũ."
                else
                   echo "Rollback thất bại! Cần kiểm tra hệ thống thủ công."
                fi
              else
                echo "Không tìm thấy phiên bản cũ để rollback."
              fi

              exit 1
            fi
          EOF
