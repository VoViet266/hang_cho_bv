name: Deploy Hang Cho Kham

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

# Không cho 2 lần deploy chạy chồng nhau
concurrency:
  group: deploy-hang-cho-kham
  cancel-in-progress: false

env:
  CONTAINER_NAME: hang_cho_kham
  IMAGE_NAME: 10.10.20.49:3000/vqviet/hang_cho_kham
  PORT: 3002
  KEEP_IMAGES: 3 # Số bản image giữ lại để backup/rollback

jobs:
  build:
    name: Build & Push to Internal Registry
    runs-on: build
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login internal registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login 10.10.20.49:3000 --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and Push Docker Image
        run: |
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"
          IMAGE_SHA="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker build \
            --pull \
            --tag "$IMAGE_LATEST" \
            --tag "$IMAGE_SHA" \
            .

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Cleanup old images on build runner
        if: always()
        run: |
          docker image ls "${{ env.IMAGE_NAME }}" --format '{{.Tag}}' \
            | grep -Ev '^(latest|<none>)$' \
            | tail -n +$(( ${{ env.KEEP_IMAGES }} + 1 )) \
            | while read -r tag; do docker rmi "${{ env.IMAGE_NAME }}:$tag" >/dev/null 2>&1 || true; done
          docker logout 10.10.20.49:3000 || true

  deploy:
    name: Deploy via SSH Key
    needs: build
    runs-on: deploy
    timeout-minutes: 15
    steps:
      - name: Setup SSH and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICE_NAME: ${{ secrets.VOICE_NAME }}
          SPEAKING_RATE: ${{ secrets.SPEAKING_RATE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.PORT }}
          KEEP_IMAGES: ${{ env.KEEP_IMAGES }}
          LOGS_VOLUME: ${{ secrets.LOGS_VOLUME || '' }}
        run: |
          set -e

          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Ưu tiên host key ghim sẵn trong secret; nếu chưa có thì quét như cũ
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          else
            echo "::warning::Chưa có secret SSH_KNOWN_HOSTS, dùng ssh-keyscan (kém an toàn hơn)"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$KNOWN_HOSTS_FILE"
          fi

          SSH_CMD_ENV="REGISTRY_TOKEN=$(printf '%q' "$REGISTRY_TOKEN") REGISTRY_USERNAME=$(printf '%q' "$REGISTRY_USERNAME") DATABASE_URL=$(printf '%q' "$DATABASE_URL") IMAGE_NAME=$(printf '%q' "$IMAGE_NAME") IMAGE_TAG=$(printf '%q' "$IMAGE_TAG") CONTAINER_NAME=$(printf '%q' "$CONTAINER_NAME") PORT=$(printf '%q' "$PORT") KEEP_IMAGES=$(printf '%q' "$KEEP_IMAGES") LOGS_VOLUME=$(printf '%q' "$LOGS_VOLUME") GOOGLE_TTS_API_KEY=$(printf '%q' "$GOOGLE_TTS_API_KEY") VOICE_NAME=$(printf '%q' "$VOICE_NAME") SPEAKING_RATE=$(printf '%q' "$SPEAKING_RATE")"

          ssh -i "$KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" $SSH_CMD_ENV /bin/bash -s <<'EOF'
            set -e

            if [ -z "$LOGS_VOLUME" ]; then
              LOGS_VOLUME="$HOME/logs"
            fi
            AUDIO_CACHE_VOLUME="$HOME/hang_cho_kham_audio_cache"
            NEW_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            echo "Sử dụng LOGS_VOLUME=$LOGS_VOLUME, AUDIO_CACHE_VOLUME=$AUDIO_CACHE_VOLUME"

            echo "Đăng nhập Internal Registry..."
            if [ -z "$REGISTRY_TOKEN" ]; then
              echo "Lỗi: Không tìm thấy REGISTRY_TOKEN trong Secrets!"
              exit 1
            fi
            printf '%s' "$REGISTRY_TOKEN" | docker login 10.10.20.49:3000 -u "$REGISTRY_USERNAME" --password-stdin

            PREVIOUS_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")

            # Pull đúng bản vừa build (theo SHA) thay vì :latest
            echo "Pulling image $NEW_IMAGE ..."
            docker pull "$NEW_IMAGE"

            echo "Dừng container cũ..."
            docker rm -f "$CONTAINER_NAME" || true

            mkdir -p "$LOGS_VOLUME" "$AUDIO_CACHE_VOLUME"
            chmod 755 "$LOGS_VOLUME" "$AUDIO_CACHE_VOLUME" || true

            start_container() {
              local IMAGE=$1
              docker run -d \
                --name "$CONTAINER_NAME" \
                --network hospital_net \
                -p "$PORT:$PORT" \
                -e PORT="$PORT" \
                -e ASPNETCORE_URLS="http://0.0.0.0:$PORT" \
                -e ASPNETCORE_ENVIRONMENT="Production" \
                -e TZ="Asia/Ho_Chi_Minh" \
                -e DATABASE_URL="$DATABASE_URL" \
                -e GOOGLE_TTS_API_KEY="$GOOGLE_TTS_API_KEY" \
                -e VOICE_NAME="$VOICE_NAME" \
                -e SPEAKING_RATE="$SPEAKING_RATE" \
                -v /etc/localtime:/etc/localtime:ro \
                -v "$LOGS_VOLUME":/app/logs \
                -v "$AUDIO_CACHE_VOLUME":/app/wwwroot/audio/cache \
                --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=5 \
                "$IMAGE"
            }

            is_healthy() {
              curl -fsS -o /dev/null --max-time 5 "http://localhost:$PORT/health" >/dev/null 2>&1 \
                || curl -fsS -o /dev/null --max-time 5 "http://localhost:$PORT/" >/dev/null 2>&1
            }

            wait_healthy() {
              local retries=$1 i
              for i in $(seq 1 "$retries"); do
                if is_healthy; then return 0; fi
                echo "Healthcheck attempt $i/$retries failed; retry in 5s..."
                sleep 5
              done
              return 1
            }

            # Giữ lại KEEP_IMAGES bản mới nhất (theo tag SHA) của dự án, xoá phần còn lại
            cleanup_old_images() {
              docker image ls "$IMAGE_NAME" --format '{{.Tag}}' \
                | grep -Ev '^(latest|<none>)$' \
                | tail -n +$((KEEP_IMAGES + 1)) \
                | while read -r tag; do docker rmi "$IMAGE_NAME:$tag" >/dev/null 2>&1 || true; done
            }

            echo "Khởi động container với image mới..."
            start_container "$NEW_IMAGE"

            echo "Chờ service khởi động (tối đa ~60s)..."
            if wait_healthy 12; then
              echo "Health check thành công!"
              cleanup_old_images || true
              docker logout 10.10.20.49:3000 >/dev/null 2>&1 || true
              exit 0
            fi

            echo "Health check thất bại! Dump logs:"
            docker logs "$CONTAINER_NAME" --tail=100 || true

            echo "Bắt đầu rollback..."
            docker rm -f "$CONTAINER_NAME" || true

            if [ -n "$PREVIOUS_IMAGE_ID" ]; then
              echo "Khôi phục container từ image cũ ($PREVIOUS_IMAGE_ID)..."
              start_container "$PREVIOUS_IMAGE_ID"
              if wait_healthy 6; then
                echo "Rollback thành công!"
              else
                echo "Rollback thất bại! Cần kiểm tra thủ công."
              fi
            else
              echo "Không tìm thấy phiên bản cũ để rollback."
            fi

            docker logout 10.10.20.49:3000 >/dev/null 2>&1 || true
            exit 1
          EOF