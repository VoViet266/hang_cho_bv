name: Deploy Hang Cho Kham

on:
  push:
    branches:
      - main
      - master

env:
  CONTAINER_NAME: hang_cho_kham
  IMAGE_NAME: 10.10.20.49:3000/vqviet/hang_cho_kham
  PORT: 3002

jobs:
  build:
    name: Build & Push to Internal Registry
    runs-on: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login internal registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login 10.10.20.49:3000 --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
  
      - name: Dọn dẹp cache Docker cũ trước khi build
        run: |
          echo "Dọn dẹp cache Docker cũ hơn ${{ env.CACHE_TTL_HOURS }} giờ trước khi build..."
          docker builder prune --filter "until=${{ env.CACHE_TTL_HOURS }}h" -f || true

      - name: Khởi tạo file .env.production
        run: |
          echo "Tiến hành tạo file biến môi trường..."
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.production

      - name: Build and Push Docker Image
        run: |
          IMAGE_LATEST="${{ env.IMAGE_NAME }}:latest"
          IMAGE_SHA="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_LATEST" \
            --tag "$IMAGE_SHA" \
            --push \
            .

  deploy:
    name: Deploy via SSH Key
    needs: build
    runs-on: deploy
    steps:
      - name: Setup SSH agent and Deploy
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'
            set -e 

            echo "Đăng nhập Internal Registry..."
            if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
              echo "Lỗi: Không tìm thấy REGISTRY_TOKEN trong Secrets!"
              exit 1
            fi
            printf '%s' "${{ secrets.REGISTRY_TOKEN }}" | docker login 10.10.20.49:3000 -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            # Khai báo biến cục bộ trên Server từ env của Workflow
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            PORT="${{ env.PORT }}"

            echo "Pulling image mới nhất..."
            docker pull $IMAGE_NAME:latest

            echo "Khởi động lại container bằng Docker CLI..."
            docker rm -f $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              -p $PORT:$PORT \
              -e PORT=$PORT \
              -e TZ="Asia/Ho_Chi_Minh" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -v /etc/localtime:/etc/localtime:ro \
              -v /etc/timezone:/etc/timezone:ro \
              --restart unless-stopped \
              $IMAGE_NAME:latest

            docker image prune -f

            echo "Đợi 10s để service khởi động..."
            sleep 10

            if curl -s -I http://localhost:$PORT > /dev/null 2>&1; then
              echo "Health check thành công (server đang lắng nghe)!"
            else
              echo "Health check thất bại! Dump logs của container:"
              docker logs $CONTAINER_NAME --tail=100
              exit 1
            fi
          EOF